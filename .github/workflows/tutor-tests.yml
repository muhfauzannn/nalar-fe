name: TutorAI checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tutor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tutor
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tutor-browser-traces
          path: test-results/
          retention-days: 7

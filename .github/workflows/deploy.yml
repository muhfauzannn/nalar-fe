name: Build Frontend and Sync Dokploy Source

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: nalar-frontend-source-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: |
          docker buildx build --platform linux/amd64 --target runtime --load \
            --build-arg VITE_API_URL=https://api.nalar.muhfauzan.dev \
            --build-arg VITE_APP_URL=https://nalar.muhfauzan.dev \
            -t nalar-fe:ci .

  sync-parent:
    name: Update Bernalar frontend submodule
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Bernalar backend repository
        uses: actions/checkout@v4
        with:
          repository: muhfauzannn/nalar-be
          ref: main
          token: ${{ secrets.NALAR_PARENT_SYNC_TOKEN }}
          path: nalar-be
          persist-credentials: true
          submodules: false

      - name: Update frontend gitlink
        working-directory: nalar-be
        env:
          FRONTEND_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$FRONTEND_COMMIT" ]; then
            echo "::error::Missing frontend commit."
            exit 1
          fi
          current="$(git ls-tree HEAD frontend | awk '{print $3}')"
          if [[ "$current" == "$FRONTEND_COMMIT" ]]; then
            echo "Bernalar already points to this frontend commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --add --cacheinfo "160000,$FRONTEND_COMMIT,frontend"
          git commit -m "chore: update frontend submodule"
          git push origin HEAD:main
